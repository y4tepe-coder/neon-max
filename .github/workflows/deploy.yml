name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          envs: RESEND_API_KEY,SMTP_USER,SMTP_PASS,NOTIFY_EMAIL
          script: |
            set -e
            mkdir -p /docker/neon-website
            cd /docker/neon-website
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/y4tepe-coder/neon-max.git
            fi
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            umask 077
            {
              printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
              printf 'SMTP_HOST=%s\n' 'smtp.gmail.com'
              printf 'SMTP_PORT=%s\n' '587'
              printf 'SMTP_USER=%s\n' "$SMTP_USER"
              printf 'SMTP_PASS=%s\n' "$SMTP_PASS"
              printf 'NOTIFY_EMAIL=%s\n' "$NOTIFY_EMAIL"
              printf 'NFC_INQUIRY_TO=%s\n' "$NOTIFY_EMAIL"
            } > .env.runtime
            set +e
            docker compose down --remove-orphans
            docker rm -f neon-website-neon-agentur-1 2>/dev/null || true
            docker network rm neon-website_default 2>/dev/null || true
            set -e
            docker compose up -d --build
            docker compose exec -T neon-agentur node -e '
              const required = ["RESEND_API_KEY", "NOTIFY_EMAIL"];
              const missing = required.filter((name) => !process.env[name]);
              if (missing.length) {
                console.error(`Missing runtime mail configuration: ${missing.join(", ")}`);
                process.exit(1);
              }
              console.log("Runtime mail configuration is present.");
            '
            if ! docker compose exec -T neon-agentur node -e '
              (async () => {
                const response = await fetch(
                  "http://127.0.0.1:3000/api/nfc-anfragen",
                  {
                    method: "POST",
                    headers: {
                      Origin: "https://neon-bw.de",
                      "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                      company: "NEON Container-Funktionstest",
                      contactName: "Test Profil",
                      role: "Test",
                      phone: "+491761234567",
                      email: process.env.NOTIFY_EMAIL,
                      website: "https://neon-bw.de",
                      whatsapp: false,
                      location: "Stuttgart",
                      bio: "Automatischer Funktionstest der NFC-Anfrage.",
                      accent: "lime",
                      packageSize: "5",
                      inquiryName: "NEON Funktionstest",
                      inquiryEmail: process.env.NOTIFY_EMAIL,
                      inquiryPhone: "",
                      note: "Automatischer Funktionstest – bitte ignorieren.",
                      consent: true,
                      companyWebsite: "",
                    }),
                  }
                );
                if (!response.ok) {
                  console.error("NFC route check failed:", response.status);
                  process.exit(1);
                }
                console.log("NFC route check passed.");
              })().catch((error) => {
                console.error("NFC route check failed:", error.name);
                process.exit(1);
              });
            '; then
              docker compose logs --tail 30 neon-agentur
              exit 1
            fi
